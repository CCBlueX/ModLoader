name: Build

on:
  push:
    branches: [main]
    # v0.1.0 releases 0.1.0
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            program: modloader-linux-x86_64
          - os: macos-latest
            program: modloader-macos-aarch64
          - os: windows-latest
            program: modloader-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # agent-usage check compares against the target branch
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Take the version from the tag
        if: github.ref_type == 'tag'
        # Every Gradle step below reads it as -PmodloaderVersion.
        run: echo "ORG_GRADLE_PROJECT_modloaderVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        # The tests attach the command line tool to a JVM, which every system does its own way.
        run: ./gradlew build
      - name: Test the Rust crate
        working-directory: rust
        run: cargo test --locked --all-features
      - name: AI usage files and tags
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo "$RUNNER_TEMP/agent-usage" https://raw.githubusercontent.com/1zun4/agent-usage/v1.2.0/agent-usage
          echo "4dd8f5dbac6dc84c3552d038f9311061e4216a77e79c843cf68511aa76be7011  $RUNNER_TEMP/agent-usage" | sha256sum -c -
          python3 "$RUNNER_TEMP/agent-usage" check --base origin/main
      - name: Collect the release files
        run: |
          mkdir release
          cp agent/build/dist/modloader${{ runner.os == 'Windows' && '.exe' || '' }} release/${{ matrix.program }}
          if [ "$RUNNER_OS" = Linux ]; then
            cp agent/build/dist/modloader.jar api/build/libs/modloader-api.jar release/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.program }}
          path: release/*
      - name: Publish to maven.ccbluex.net
        if: runner.os == 'Linux' && github.event_name == 'push'
        env:
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_TOKEN_NAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_TOKEN_SECRET }}
        run: >-
          ./gradlew publish
          -PmavenUrl=https://maven.ccbluex.net/${{ github.ref_type == 'tag' && 'releases' || 'snapshots' }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --verify-tag
          else
            # Recreated, as an existing release cannot move its tag to the new commit.
            gh release delete snapshot --cleanup-tag --yes || true
            gh release create snapshot release/* \
              --title "Snapshot" \
              --notes "Automatic build of \`${GITHUB_SHA::7}\` from \`main\`." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
