name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # agent-usage check compares against the target branch
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      - name: AI usage files and tags
        run: |
          curl -fsSLo "$RUNNER_TEMP/agent-usage" https://raw.githubusercontent.com/1zun4/agent-usage/v1.2.0/agent-usage
          echo "4dd8f5dbac6dc84c3552d038f9311061e4216a77e79c843cf68511aa76be7011  $RUNNER_TEMP/agent-usage" | sha256sum -c -
          python3 "$RUNNER_TEMP/agent-usage" check --base origin/main
      - uses: actions/upload-artifact@v7
        with:
          name: modloader
          path: |
            cli/build/libs/modloader.jar
            api/build/libs/modloader-api.jar
      - name: Publish snapshot release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreated, as an existing release cannot move its tag to the new commit.
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot cli/build/libs/modloader.jar api/build/libs/modloader-api.jar \
            --title "Snapshot" \
            --notes "Automatic build of \`${GITHUB_SHA::7}\` from \`main\`." \
            --prerelease \
            --target "$GITHUB_SHA"
      - name: Publish API to maven.ccbluex.net
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_TOKEN_NAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_TOKEN_SECRET }}
        run: ./gradlew :api:publish -PmavenUrl=https://maven.ccbluex.net/snapshots
