[versions]
# What Minecraft 26.3 ships; the loader uses the game's copies.
gson = "2.14.0"
guava = "33.6.0-jre"

# What NeoForge and Forge read mods.toml with; shipped for the games without them.
nightconfig = "3.9.0"

# What Fabric Loader 0.20.1 runs Mixin with.
asm = "9.10.1"
mixin = "0.17.5+mixin.0.8.7"
mixinextras = "0.5.5"

fabric-loader = "0.20.1"
quilt-loader = "0.30.2"
neoforge-fml = "12.0.16"
forge = "26.3-66.1.9"
jspecify = "1.0.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
nightconfig-toml = { module = "com.electronwill.night-config:toml", version.ref = "nightconfig" }

asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
mixinextras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
quilt-loader = { module = "org.quiltmc:quilt-loader", version.ref = "quilt-loader" }
neoforge-fml = { module = "net.neoforged.fancymodloader:loader", version.ref = "neoforge-fml" }
forge-universal = { module = "net.minecraftforge:forge", version.ref = "forge" }
forge-fmlcore = { module = "net.minecraftforge:fmlcore", version.ref = "forge" }
forge-fmlloader = { module = "net.minecraftforge:fmlloader", version.ref = "forge" }
forge-javafml = { module = "net.minecraftforge:javafmllanguage", version.ref = "forge" }
forge-spi = "net.minecraftforge:forgespi:8.0.0"
forge-eventbus = "net.minecraftforge:eventbus:7.0.6"
forge-securemodules = "net.minecraftforge:securemodules:2.2.24"
forge-mergetool = "net.minecraftforge:mergetool-api:1.0"

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

[bundles]
forge = ["forge-fmlcore", "forge-fmlloader", "forge-javafml", "forge-spi", "forge-eventbus", "forge-securemodules", "forge-mergetool", "asm"]
# Shipped in modloader.jar and loaded apart from the game's copies.
mixin = ["mixin", "mixinextras", "asm", "asm-tree", "asm-commons", "asm-analysis", "asm-util"]
