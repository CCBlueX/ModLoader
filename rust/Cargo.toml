[package]
name = "modloader"
version = "0.1.0"
edition = "2024"
description = "Loads mods into a running Minecraft: a library for launchers, with a command line tool"
license = "GPL-3.0-or-later"
repository = "https://github.com/CCBlueX/ModLoader"

[features]
# The command line tool.
cli = ["dep:clap"]

[[bin]]
name = "modloader"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
# The loader in the game takes requests and answers as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The process list with command lines, on every system.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# The file the game writes its answer to.
tempfile = "3"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# kill, geteuid and macOS's confstr.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
